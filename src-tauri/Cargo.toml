[package]
name = "pixel-pomodoro-pet"
version = "0.1.0"
description = "Pomodoro de escritorio siempre visible con una mascota pixel-art developer"
authors = ["LuisUmina"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The desktop binary is a thin wrapper around this lib so the app can also be
# driven from integration tests and future mobile targets.
name = "pixel_pomodoro_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
