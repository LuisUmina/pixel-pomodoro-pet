<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Pomodoro Pet</title>
  </head>
  <body>
    <!-- Two nested clipped boxes fake a chunky pixel border with bevelled
         corners: the outer one is the border colour, the inner the surface. -->
    <div class="frame" id="frame">
      <div class="widget" id="widget" data-phase="focus" data-status="idle">
        <header class="titlebar" data-tauri-drag-region>
          <span class="titlebar__lights" data-tauri-drag-region>
            <i class="light light--danger"></i>
            <i class="light light--warn"></i>
            <i class="light light--ok"></i>
          </span>
          <span class="titlebar__path" id="path" data-tauri-drag-region>~/focus</span>
          <span class="titlebar__actions">
            <button
              type="button"
              class="iconbtn"
              data-action="settings"
              data-i18n-title="titlebar.settings"
              title="Settings"
              aria-pressed="false"
            >
              ⚙
            </button>
            <button
              type="button"
              class="iconbtn"
              data-action="theme"
              data-i18n-title="titlebar.theme"
              title="Cycle theme"
            >
              ◑
            </button>
            <button
              type="button"
              class="iconbtn"
              data-action="sound"
              data-i18n-title="titlebar.sound"
              title="Toggle sound"
              aria-pressed="true"
            >
              ♪
            </button>
            <button
              type="button"
              class="iconbtn"
              data-action="ghost"
              data-i18n-title="titlebar.ghost"
              title="Click-through — press Ctrl+Alt+G to turn it back off"
              aria-pressed="false"
            >
              ◇
            </button>
            <button
              type="button"
              class="iconbtn"
              data-action="mini"
              data-i18n-title="titlebar.mini"
              title="Mini mode — press Ctrl+Alt+Z to switch back"
              aria-pressed="false"
            >
              ▫
            </button>
            <button
              type="button"
              class="iconbtn"
              data-action="checklist"
              data-i18n-title="titlebar.checklist"
              title="Show task checklist"
              aria-pressed="false"
            >
              ☑
            </button>
            <button
              type="button"
              class="iconbtn"
              data-action="hide"
              data-i18n-title="titlebar.hide"
              title="Hide — press Ctrl+Alt+H to bring it back"
            >
              ─
            </button>
          </span>
        </header>

        <main class="stage" id="stage" data-tauri-drag-region>
          <canvas class="pet" id="pet" data-tauri-drag-region></canvas>

          <!-- Overlays the stage rather than sitting in the flow, so a line
               arriving never changes the size of anything. -->
          <div class="bubble" id="bubble" title="Click to dismiss" hidden>
            <div class="bubble__box">
              <p class="bubble__text" id="bubble-text" aria-live="polite"></p>
            </div>
          </div>
        </main>

        <section class="readout" data-tauri-drag-region>
          <canvas class="clock" id="clock"></canvas>
          <p class="phase" id="phase">focus</p>
        </section>

        <!-- Optional, mini-mode-only: today's checklist floating under the
             mascot. Hidden outside mini mode and whenever the toggle above
             is off; JS drives the `hidden` attribute directly rather than
             going through `data-mini` in CSS. -->
        <div class="mini-checklist" id="mini-checklist" hidden></div>

        <div class="progress">
          <span class="progress__fill" id="progress"></span>
        </div>

        <div class="task-row">
          <label class="task">
            <span class="task__prompt">$</span>
            <input
              type="text"
              id="task"
              class="task__input"
              maxlength="48"
              spellcheck="false"
              autocomplete="off"
              data-i18n-placeholder="task.placeholder"
              placeholder="what are you working on?"
            />
          </label>
          <button
            type="button"
            class="iconbtn"
            data-action="tasks"
            data-i18n-title="task.list"
            title="Task list"
          >
            ☰
          </button>
        </div>

        <div class="controls">
          <button type="button" class="btn btn--primary" data-action="toggle" id="toggle">
            START
          </button>
          <button
            type="button"
            class="btn"
            data-action="skip"
            data-i18n-title="controls.skipHint"
            title="Skip (Ctrl+Alt+N)"
          >
            SKIP
          </button>
          <button
            type="button"
            class="btn"
            data-action="reset"
            data-i18n-title="controls.resetHint"
            title="Reset (Ctrl+Alt+R)"
          >
            RESET
          </button>
        </div>

        <footer class="statusline">
          <span class="rounds" id="rounds"></span>
          <span class="statusline__right">
            <button
              type="button"
              class="tally"
              id="tally"
              data-action="history"
              data-i18n-title="status.viewHistory"
              title="View history"
            >
              0 today
            </button>
            <span
              class="grip"
              id="grip"
              data-i18n-title="status.resize"
              title="Drag to resize"
            ></span>
          </span>
        </footer>

        <!-- Overlays the card rather than growing it, so the window size is
             never a function of whether settings happen to be open. -->
        <section class="panel" id="settings" hidden>
          <header class="panel__bar">
            <span class="panel__title" data-i18n="settings.title">settings</span>
            <button
              type="button"
              class="iconbtn"
              data-action="settings"
              data-i18n-title="titlebar.close"
              title="Close"
            >
              ✕
            </button>
          </header>

          <div class="panel__body">
            <label class="field">
              <span class="field__label" data-i18n="settings.focus">focus</span>
              <input type="number" id="set-focus" min="1" max="180" step="1" />
              <span class="field__unit">min</span>
            </label>
            <label class="field">
              <span class="field__label" data-i18n="settings.break">break</span>
              <input type="number" id="set-short" min="1" max="180" step="1" />
              <span class="field__unit">min</span>
            </label>
            <label class="field">
              <span class="field__label" data-i18n="settings.longBreak">long break</span>
              <input type="number" id="set-long" min="1" max="180" step="1" />
              <span class="field__unit">min</span>
            </label>
            <label class="field">
              <span class="field__label" data-i18n="settings.rounds">rounds</span>
              <input type="number" id="set-rounds" min="1" max="12" step="1" />
              <span class="field__unit" data-i18n="settings.roundsUnit">/cycle</span>
            </label>

            <label class="check">
              <input type="checkbox" id="set-auto-breaks" />
              <span data-i18n="settings.autoBreaks">auto-start breaks</span>
            </label>
            <label class="check">
              <input type="checkbox" id="set-auto-focus" />
              <span data-i18n="settings.autoFocus">auto-start focus</span>
            </label>
            <label
              class="check"
              data-i18n-title="settings.miniModeHint"
              title="Shrink the frame down to just the mascot and the clock"
            >
              <input type="checkbox" id="set-mini" />
              <span data-i18n="settings.miniMode">mini mode</span>
            </label>

            <div class="field field--chips">
              <span class="field__label" data-i18n="settings.size">size</span>
              <span class="chips" id="set-sizes"></span>
            </div>

            <div
              class="field field--chips"
              data-i18n-title="settings.dimHint"
              title="How opaque the widget stays once a session has been running for a while, unattended"
            >
              <span class="field__label" data-i18n="settings.dim">dim</span>
              <span class="chips" id="set-dim"></span>
            </div>

            <div class="field field--chips">
              <span class="field__label" data-i18n="settings.pet">pet</span>
              <span class="pet-picker">
                <canvas
                  class="pet-preview"
                  id="set-pet-preview"
                  data-i18n-aria-label="settings.petPreview"
                  aria-label="Animated preview of the selected character"
                ></canvas>
                <span class="chips" id="set-pet"></span>
              </span>
            </div>

            <div class="field field--chips">
              <span class="field__label" data-i18n="settings.voice">voice</span>
              <span class="chips" id="set-voice"></span>
            </div>

            <div class="field field--chips">
              <span class="field__label" data-i18n="settings.language">language</span>
              <span class="chips" id="set-language"></span>
            </div>

            <div
              class="field field--chips"
              data-i18n-title="settings.goalHint"
              title="Pomodoros that make a good day, shown next to the tally"
            >
              <span class="field__label" data-i18n="settings.goal">goal</span>
              <span class="chips" id="set-goal"></span>
            </div>

            <p class="panel__heading" data-i18n="settings.reminders">reminders</p>
            <div class="reminders" id="set-reminders"></div>

            <p class="panel__heading" data-i18n="settings.customReminders">custom reminders</p>
            <button type="button" class="btn" id="custom-reminder-open" data-i18n="settings.manage">
              MANAGE
            </button>

            <p class="panel__heading" data-i18n="settings.shortcuts">shortcuts</p>
            <div class="shortcuts" id="set-shortcuts"></div>
            <p class="shortcuts__error" id="set-shortcuts-error" hidden></p>

            <div
              class="field field--chips"
              data-i18n-title="settings.quietHint"
              title="Silence everything for a while"
            >
              <span
                class="field__label"
                data-i18n-title="settings.quietHint"
                data-i18n="settings.quiet"
                title="Silence everything for a while"
              >
                quiet
              </span>
              <span class="chips" id="set-quiet"></span>
            </div>

            <p class="panel__heading" data-i18n="settings.backup">backup</p>
            <div class="backup-actions">
              <button
                type="button"
                class="btn"
                data-action="export-data"
                data-i18n="settings.exportData"
                data-i18n-title="settings.exportDataHint"
                title="Export all app data to a JSON file"
              >
                EXPORT DATA
              </button>
              <button
                type="button"
                class="btn"
                data-action="import-data"
                data-i18n="settings.importData"
                data-i18n-title="settings.importDataHint"
                title="Import app data from a JSON file"
              >
                IMPORT DATA
              </button>
            </div>

            <button type="button" class="btn" data-action="defaults" data-i18n="settings.restoreDefaults">
              RESTORE DEFAULTS
            </button>
          </div>

          <div class="panel__body custom-reminder-screen" id="custom-reminder-screen" hidden>
            <button type="button" class="btn" id="custom-reminder-back" data-i18n="settings.back">
              ← BACK
            </button>
            <p class="panel__heading" data-i18n="settings.customReminders">custom reminders</p>
            <div class="custom-reminder-add">
              <input
                id="custom-reminder-text"
                type="text"
                maxlength="58"
                data-i18n-placeholder="customReminder.message"
                placeholder="message"
              />
              <input
                id="custom-reminder-cadence"
                type="number"
                min="1"
                max="180"
                step="1"
                value="30"
                data-i18n-title="customReminder.cadenceHint"
                title="Every how many minutes"
              />
              <select
                id="custom-reminder-anchor"
                data-i18n-title="customReminder.anchorHint"
                title="When to remind you"
              >
                <option value="focus" data-i18n="customReminder.focus">focus</option>
                <option value="break" data-i18n="customReminder.break">break</option>
              </select>
              <button type="button" class="btn" id="custom-reminder-add">+</button>
            </div>
            <div class="custom-reminders" id="set-custom-reminders"></div>
          </div>
        </section>

        <!-- Same overlay shell as settings; computed only when opened, since
             the heatmap has no reason to be recalculated four times a
             second while it stays hidden behind a closed panel. -->
        <section class="panel" id="history" hidden>
          <header class="panel__bar">
            <span class="panel__title" data-i18n="history.title">history</span>
            <button
              type="button"
              class="iconbtn"
              data-action="history"
              data-i18n-title="titlebar.close"
              title="Close"
            >
              ✕
            </button>
          </header>

          <div class="panel__body">
            <div class="stats">
              <div
                class="stat"
                data-i18n-title="history.streakHint"
                title="Days in a row with a session. One missed day a week does not break it."
              >
                <span class="stat__value" id="hist-streak">0</span>
                <span class="stat__label" data-i18n="history.streak">streak</span>
              </div>
              <div
                class="stat"
                data-i18n-title="history.bestStreakHint"
                title="Longest streak ever"
              >
                <span class="stat__value" id="hist-best-streak">0</span>
                <span class="stat__label" data-i18n="history.bestStreak">best streak</span>
              </div>
              <div
                class="stat"
                data-i18n-title="history.totalHint"
                title="Focus sessions completed, all time"
              >
                <span class="stat__value" id="hist-total">0</span>
                <span class="stat__label" data-i18n="history.total">total</span>
              </div>
              <div
                class="stat"
                data-i18n-title="history.bestWeekHint"
                title="Best 7-day total ever"
              >
                <span class="stat__value" id="hist-best-week">0</span>
                <span class="stat__label" data-i18n="history.bestWeek">best week</span>
              </div>
            </div>

            <p class="panel__heading" data-i18n="history.lastYear">last year</p>
            <div class="heatmap" id="hist-heatmap"></div>
            <p class="history__caption" id="hist-caption"></p>
          </div>
        </section>

        <!-- Same overlay shell again. Typing in the task field only ever
             renames whichever task is active -- a second task always comes
             from here, deliberately. -->
        <section class="panel" id="tasks" hidden>
          <header class="panel__bar">
            <span class="panel__title" data-i18n="tasks.title">tasks</span>
            <button
              type="button"
              class="iconbtn"
              data-action="tasks"
              data-i18n-title="titlebar.close"
              title="Close"
            >
              ✕
            </button>
          </header>

          <div class="panel__body">
            <div class="task-add">
              <input
                type="text"
                id="task-new-text"
                maxlength="48"
                spellcheck="false"
                autocomplete="off"
                data-i18n-placeholder="task.new"
                placeholder="new task"
              />
              <input
                type="number"
                id="task-new-estimate"
                min="0"
                max="20"
                step="1"
                data-i18n-title="task.estimate"
                title="Estimated pomodoros"
                placeholder="🍅"
              />
              <input
                type="text"
                id="task-new-section"
                list="task-section-choices"
                maxlength="24"
                spellcheck="false"
                autocomplete="off"
                data-i18n-placeholder="task.section"
                data-i18n-title="task.sectionHint"
                placeholder="section"
                title="Optional section"
              />
              <datalist id="task-section-choices"></datalist>
              <button type="button" class="btn" id="task-add-btn">+</button>
            </div>

            <div class="task-list" id="task-list"></div>
          </div>
        </section>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
