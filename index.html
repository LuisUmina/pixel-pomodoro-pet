<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Pomodoro Pet</title>
  </head>
  <body>
    <!-- Two nested clipped boxes fake a chunky pixel border with bevelled
         corners: the outer one is the border colour, the inner the surface. -->
    <div class="frame" id="frame">
      <div class="widget" id="widget" data-phase="focus" data-status="idle">
        <header class="titlebar" data-tauri-drag-region>
          <span class="titlebar__lights" data-tauri-drag-region>
            <i class="light light--danger"></i>
            <i class="light light--warn"></i>
            <i class="light light--ok"></i>
          </span>
          <span class="titlebar__path" id="path" data-tauri-drag-region>~/focus</span>
          <span class="titlebar__actions">
            <button
              type="button"
              class="iconbtn"
              data-action="settings"
              title="Settings"
              aria-pressed="false"
            >
              ⚙
            </button>
            <button type="button" class="iconbtn" data-action="theme" title="Cycle theme">
              ◑
            </button>
            <button
              type="button"
              class="iconbtn"
              data-action="sound"
              title="Toggle sound"
              aria-pressed="true"
            >
              ♪
            </button>
            <button
              type="button"
              class="iconbtn"
              data-action="ghost"
              title="Click-through — press Ctrl+Alt+G to turn it back off"
              aria-pressed="false"
            >
              ◇
            </button>
            <button
              type="button"
              class="iconbtn"
              data-action="hide"
              title="Hide — press Ctrl+Alt+H to bring it back"
            >
              ─
            </button>
          </span>
        </header>

        <main class="stage" id="stage" data-tauri-drag-region>
          <canvas class="pet" id="pet" data-tauri-drag-region></canvas>

          <!-- Overlays the stage rather than sitting in the flow, so a line
               arriving never changes the size of anything. -->
          <div class="bubble" id="bubble" title="Click to dismiss" hidden>
            <div class="bubble__box">
              <p class="bubble__text" id="bubble-text" aria-live="polite"></p>
            </div>
          </div>
        </main>

        <section class="readout">
          <canvas class="clock" id="clock"></canvas>
          <p class="phase" id="phase">focus</p>
        </section>

        <div class="progress">
          <span class="progress__fill" id="progress"></span>
        </div>

        <label class="task">
          <span class="task__prompt">$</span>
          <input
            type="text"
            id="task"
            class="task__input"
            maxlength="48"
            spellcheck="false"
            autocomplete="off"
            placeholder="what are you working on?"
          />
        </label>

        <div class="controls">
          <button type="button" class="btn btn--primary" data-action="toggle" id="toggle">
            START
          </button>
          <button type="button" class="btn" data-action="skip" title="Skip (Ctrl+Alt+N)">
            SKIP
          </button>
          <button type="button" class="btn" data-action="reset" title="Reset (Ctrl+Alt+R)">
            RESET
          </button>
        </div>

        <footer class="statusline">
          <span class="rounds" id="rounds"></span>
          <span class="statusline__right">
            <span class="tally" id="tally">0 today</span>
            <span class="grip" id="grip" title="Drag to resize"></span>
          </span>
        </footer>

        <!-- Overlays the card rather than growing it, so the window size is
             never a function of whether settings happen to be open. -->
        <section class="settings" id="settings" hidden>
          <header class="settings__bar">
            <span class="settings__title">settings</span>
            <button type="button" class="iconbtn" data-action="settings" title="Close">
              ✕
            </button>
          </header>

          <div class="settings__body">
            <label class="field">
              <span class="field__label">focus</span>
              <input type="number" id="set-focus" min="1" max="180" step="1" />
              <span class="field__unit">min</span>
            </label>
            <label class="field">
              <span class="field__label">break</span>
              <input type="number" id="set-short" min="1" max="180" step="1" />
              <span class="field__unit">min</span>
            </label>
            <label class="field">
              <span class="field__label">long break</span>
              <input type="number" id="set-long" min="1" max="180" step="1" />
              <span class="field__unit">min</span>
            </label>
            <label class="field">
              <span class="field__label">rounds</span>
              <input type="number" id="set-rounds" min="1" max="12" step="1" />
              <span class="field__unit">/cycle</span>
            </label>

            <label class="check">
              <input type="checkbox" id="set-auto-breaks" />
              <span>auto-start breaks</span>
            </label>
            <label class="check">
              <input type="checkbox" id="set-auto-focus" />
              <span>auto-start focus</span>
            </label>

            <div class="field field--chips">
              <span class="field__label">size</span>
              <span class="chips" id="set-sizes"></span>
            </div>

            <div class="field field--chips">
              <span class="field__label">pet</span>
              <span class="chips" id="set-pet"></span>
            </div>

            <div class="field field--chips">
              <span class="field__label">voice</span>
              <span class="chips" id="set-voice"></span>
            </div>

            <p class="settings__heading">reminders</p>
            <div class="reminders" id="set-reminders"></div>

            <div class="field field--chips">
              <span class="field__label" title="Silence everything for a while">
                quiet
              </span>
              <span class="chips" id="set-quiet"></span>
            </div>

            <button type="button" class="btn" data-action="defaults">
              RESTORE DEFAULTS
            </button>
          </div>
        </section>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
